name: Archive screenshots
on:
  push:
    branches: [preview/archive-screenshots]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - name: Start Diary
        run: |
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          pnpm db:migrate:local
          pnpm dev --hostname 127.0.0.1 > /tmp/diary-preview.log 2>&1 &
      - name: Capture screenshots
        run: |
          mkdir -p /tmp/diary-capture screenshots
          npm install --prefix /tmp/diary-capture playwright
          /tmp/diary-capture/node_modules/.bin/playwright install --with-deps chromium
          node <<'JS'
          const { chromium } = require('/tmp/diary-capture/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch();
            try {
              for (const [label, viewport] of Object.entries({
                desktop: { width: 1440, height: 1000 },
                mobile: { width: 390, height: 844 },
              })) {
                const page = await browser.newPage({ viewport, colorScheme: 'light' });
                await page.goto('http://127.0.0.1:3000/dev/seed', { timeout: 90000 });
                await page.waitForURL('**/entries', { timeout: 60000 });
                await page.goto('http://127.0.0.1:3000/archive');
                await page.getByRole('heading', { name: 'Instagram archive.' }).waitFor();
                await page.locator('img').first().waitFor();
                await page.waitForFunction(() => [...document.querySelectorAll('img')].some(img => img.complete && img.naturalWidth > 0));
                await page.screenshot({ path: 'screenshots/' + label + '.png', fullPage: true, style: 'nextjs-portal { display: none !important; }' });
                await page.getByLabel('Calendar').fill('2024-12-01');
                await page.getByRole('heading', { name: 'A weekend away' }).waitFor();
                if (await page.getByRole('heading', { name: 'An afternoon in town' }).count()) throw new Error('Calendar did not filter older entries.');
                await page.getByRole('button', { name: /View post/ }).click();
                const detail = page.getByRole('dialog');
                await detail.getByText('That lake looks unreal.').waitFor();
                await detail.getByRole('button', { name: 'Next photo' }).click();
                await detail.getByText('2 / 2').waitFor();
                await page.screenshot({ path: 'screenshots/' + label + '-post.png', style: 'nextjs-portal { display: none !important; }' });
                await detail.getByRole('button', { name: 'Close' }).click();
                await page.getByRole('link', { name: 'Messages' }).click();
                await page.getByRole('button', { name: 'Maya' }).click();
                const chat = page.getByRole('region', { name: 'Conversation with Maya' });
                await chat.getByText('Did you keep any photos from the trip?').waitFor();
                await chat.getByRole('img', { name: 'A lake beneath the mountains' }).waitFor();
                await page.waitForFunction(() => {
                  const chat = document.querySelector('[aria-label="Conversation with Maya"]');
                  return chat?.querySelector('video')?.readyState >= 1 && chat?.querySelector('img')?.naturalWidth > 0;
                }, null, { timeout: 20000 });
                await page.screenshot({ path: 'screenshots/' + label + '-messages.png', fullPage: true, style: 'nextjs-portal { display: none !important; }' });
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: diary-archive-screenshots
          path: screenshots/*.png
